# CodeQL Advanced Setup for Go Gin Application
#
# This workflow runs CodeQL static analysis with extended security queries
# and framework-aware threat models to maximize vulnerability detection
# in a Go web application using the Gin framework.
#
# Repository context: intentionally vulnerable app for evaluating CodeQL
# detection coverage, framework limitations, and custom query extensibility.

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '38 17 * * 4'

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to GitHub Security tab
      security-events: write
      # Required for actions/checkout to fetch code
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Go toolchain so autobuild resolves dependencies correctly.
      # Pin to the version in go.mod to avoid build drift.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Initialize CodeQL with:
      #   - config-file: points to .github/codeql/codeql-config.yml which
      #     enables extended threat models so CodeQL treats Gin context
      #     methods (c.Query, c.Param, c.PostForm, c.GetHeader, c.BindJSON,
      #     c.ShouldBind, etc.) as remote taint sources.
      #   - queries: security-extended adds ~50% more security queries beyond
      #     the default suite. security-and-quality adds code-quality queries
      #     that surface maintainability issues which can become security bugs.
      #   - The "+" prefix merges these with any queries in the config file
      #     rather than replacing them.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          config-file: .github/codeql/codeql-config.yml
          # Query suites must be comma-separated on a single line.
          # The "+" prefix merges with queries defined in the config file.
          # Custom queries are referenced from codeql-config.yml, not here.
          queries: +security-extended,security-and-quality

      # Autobuild detects Go modules and runs `go build ./...` automatically.
      # No manual build step needed for standard Go projects.

      # Run analysis and upload SARIF results.
      # Results appear under Security > Code scanning alerts in the repo.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
